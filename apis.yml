aid: dpd-group

name: DPD Group

description: DPD Group (part of Geopost) is a European parcel delivery network. Its business units publish shipping APIs including the DPD Group
  META-API Shipment REST API, the DPD Czech Republic GeoAPI, and SOAP web services from DPD Germany, DPD Belgium/Luxembourg and DPD Poland for
  shipment creation, labels, tracking, pickups and parcel shop lookup.

type: Index

access: 3rd-Party

created: '2026-10-13'

