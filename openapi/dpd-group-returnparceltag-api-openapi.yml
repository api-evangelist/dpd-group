openapi: 3.2.0
info:
  title: DPDServices Return Parcel Tag API
  description: '# DPDServices


    The purpose of this document is to describe the functionality and utilization of Web Service interfaces for the use of DPD clients. The solution provided offers a universal (independent of the client''s system) tool for transmitting information between client systems and DPD. The following Web Service methods are available:


    - Validation of shipment data and assignment of waybill numbers

    - Generation of waybill labels

    - Generation of receipt protocols and data notification

    - Courier booking

    - Postal code lookup

    - Courier availability check

    - Validation of return shipment data with predefined waybill numbers and notification


    Each Web Service method call is authorized by a login and password and marked with one of three error-handling policies:


    - Termination of processing upon encountering the first error

    - Ignoring shipments with incorrect data

    - Termination of processing upon encountering the first error and cancellation of processed shipments before the error occurred. (This option is available only in some Web Service methods)


    A client integrated with DPD Poland through this solution can be assured of the compliance of prepared shipments with the current standard, which implies an improvement in the efficiency and reliability of services offered by our courier company. ## Environments


    **Production environment:**

    Production services are available at: https://dpdservices.dpd.com.pl


    **Demo environment:**

    Demo services are available at: https://dpdservicesdemo.dpd.com.pl


    To access the DEMO environment, you will need the following login credentials:


    - **Login:** test

    - **Password:** thetu4Ee

    - **Master FID:** 1495


    ## Authentication


    All endpoints require of **Basic Authentication** and the **x-dpd-fid: {{masterfid}}** header:


    -->


    ## Configuration of Login and Password


    The complete configuration of a user account authorized to use the web service is carried out in DPD Poland''s systems after prior agreements with the client. # Available Services


    Within the scope of generating a waybill, it''s possible to include services that modify various aspects related to parcel delivery. Depending on whether the parcel will be delivered domestically or internationally, the list of services will differ. Some services require specific conditions that must be met to be used. Validation of certain services may also exclude their simultaneous use. ### Services


    | Service Code | Service | Domestic / International | Notes |

    |-------------------------|---------------------------------------------------|--------------------------|-----------------------------------|

    | B2C | B2C | `domestic` | Required Attributes:

    `VALUE` - e.g. ''10:00-13:00'' |

    | CARRY_IN | Carry in | `domestic` | |

    | COD * | Cash on delivery | `domestic`

    `international` | Currencies - only PLN, EUR, RON, CZK

    Required Attributes:

    `AMOUNT` - e.g. ''39.99''

    `CURRENCY` - e.g. ''PLN'' |

    | CUD | Return shipment | `domestic` | |

    | DECLARED_VALUE | Declared value | `domestic`

    `international` | Shipment insurance. Currencies - only PLN, CHF, EUR, NOK, SEK, USD, GBP, HUF, CZK

    Required Attributes:

    `AMOUNT` - e.g. ''39.99''

    `CURRENCY` - e.g. ''PLN'' |

    | DIGITAL_LABEL ** | Digital label service | `domestic` | Only for single-package shipments |

    | DPD_EXPRESS | Air transport | `international` | |

    | DPD_FOOD | Food transportation service | `domestic` | Only for specified postal codes

    Required Attributes:

    `LIMIT_DATE` - product''s expiration date (ISO-8601 format), which must not be less than 2 business days e.g. ''2039-12-31'' |

    | DPD_LQ * | ADR transportation service | `domestic`

    `international` | Dangerous shipment: ADR weight required |

    | DPD_NEXT_DAY | Delivery on next day | `domestic` | |

    | DPD_PICKUP | Parcel delivery service to the PUDO point | `domestic`

    `international` | Only for specified postal codes

    Required Attributes:

    `PUDO` - e.g.'
  version: 5.27.0
  x-logo:
    url: /redoc-ui/DPD_logo.svg
servers:
- url: https://dpdservices.dpd.com.pl
  description: Generated server url
security:
- basicAuth: []
tags:
- name: returnParcelTag
  x-displayName: Parcel Returns
paths:
  /public/shipment/v1/generateReturnLabel:
    post:
      tags:
      - returnParcelTag
      summary: Generate international return label
      description: 'Generates international return label (available only after coordination with the account manager).


        This method is used to create international return shipments and accepts the following input parameters:


        - Parcel data for return to an international shipment, including:

        - Waybills to locate the parcel being returned

        - Recipient data for the return shipment

        - Printing parameters


        On the DPD system side, the following operations are performed:


        - Check the client''s authorization to add a specific type of event

        - Add a parcel to an existing shipment


        The method returns:


        - Status of the executed operation

        - Generated labels in the requested format

        - Waybill of the generated return parcel

        - Exception for incorrect input data

        - Exception if the client lacks authorization to use the service


        This method is not available by default and requires special configuration on the DPD system side to allow clients who can use it.'
      operationId: generateReturnLabel
      parameters:
      - name: x-dpd-fid
        in: header
        description: Client's payer number.
        required: true
        schema:
          type: integer
          format: int32
        example: 1000
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GenerateReturnLabelRequest'
        required: true
      responses:
        '403':
          description: Forbidden API request
        '415':
          description: Bad content-type
        '500':
          description: Unknown error.
        '400':
          description: Bad API invocation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Errors'
        '401':
          description: Unauthorized API request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error401'
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenerateReturnLabelResponse'
  /public/shipment/v1/generateDomesticReturnLabel:
    post:
      tags:
      - returnParcelTag
      summary: Generate return label
      description: 'Generates return label.


        This method is used to create domestic return shipments and accepts the following input parameters:


        - Parcel data for return to a domestic shipment, including:

        - Waybills to locate the parcel being returned

        - Recipient data for the return shipment

        - Printing parameters


        On the DPD system side, the following operations are performed:


        - Verification of whether the payer has activated the Consumer Returns service in the Customer Management application

        - Check the client''s authorization to add a specific type of event

        - Add a parcel to an existing shipment


        The method returns:


        - Status of the executed operation

        - Generated labels in the requested format

        - Waybills of the generated return parcels

        - Exception for incorrect input data

        - Exception if the client lacks authorization to use the service

        - Exception if the payer does not have an active Consumer Returns service


        This method is not available by default and requires special configuration on the DPD system side to allow clients who can use it.'
      operationId: generateDomesticReturnLabel
      parameters:
      - name: x-dpd-fid
        in: header
        description: Client's payer number.
        required: true
        schema:
          type: integer
          format: int32
        example: 1000
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GenerateReturnLabelRequest'
        required: true
      responses:
        '403':
          description: Forbidden API request
        '415':
          description: Bad content-type
        '500':
          description: Unknown error.
        '400':
          description: Bad API invocation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Errors'
        '401':
          description: Unauthorized API request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error401'
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenerateReturnLabelResponse'
  /public/shipment/v1/generateReturnPackages:
    post:
      tags:
      - returnParcelTag
      summary: Create return packages and parcels
      description: Creates return packages and parcels.
      operationId: generateReturnPackages
      parameters:
      - name: x-dpd-fid
        in: header
        description: Client's payer number.
        required: true
        schema:
          type: integer
          format: int32
        example: 1000
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GenerateReturnPackagesRequest'
        required: true
      responses:
        '403':
          description: Forbidden API request
        '415':
          description: Bad content-type
        '500':
          description: Unknown error.
        '400':
          description: Bad API invocation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Errors'
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenerateReturnPackagesResponse'
        '401':
          description: Unauthorized API request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error401'
components:
  schemas:
    ReturnParcelValidationErrorCode:
      type: string
      description: 'Allowed values:

        - INCORRECT_WEIGHT - incorrect weight,

        - PALETTE_EXCEEDED_DIMENSION_80X120X170 - Parcel exceeded dimension 80x120x170 with PALETTE service

        - PALETTE_EXCEEDED_DIMENSION_80X120X180 - Parcel exceeded dimension 80x120x180 with PALETTE service

        - PALETTE_EXCEEDED_DIMENSION_80X120X220 - Parcel exceeded dimension 80x120x220 with PALETTE service

        - SIZE_X_OUT_OF_RANGE - size X is out of range

        - SIZE_Y_OUT_OF_RANGE - size Y is out of range

        - SIZE_Z_OUT_OF_RANGE - size Z is out of range

        - SIZE_SUM_OUT_OF_RANGE - sum of sizes is out of range

        - PARCEL_EXCEEDED_DIMENSION_38X41X64 - Parcel exceeded dimension 38x41x64

        '
      enum:
      - INCORRECT_WEIGHT
      - PALETTE_EXCEEDED_DIMENSION_80X120X170
      - PALETTE_EXCEEDED_DIMENSION_80X120X180
      - PALETTE_EXCEEDED_DIMENSION_80X120X220
      - SIZE_X_OUT_OF_RANGE
      - SIZE_Y_OUT_OF_RANGE
      - SIZE_Z_OUT_OF_RANGE
      - SIZE_SUM_OUT_OF_RANGE
      - PARCEL_EXCEEDED_DIMENSION_38X41X64
    ReturnParcelGenerationStatus:
      type: string
      description: 'Allowed values:

        - OK - parcel created successfully

        - INCORRECT_DATA - incorrect data

        - NOT_PROCESSED - not processed

        '
      enum:
      - OK
      - INCORRECT_DATA
      - NOT_PROCESSED
    SecurityErrorEnum:
      type: string
      description: 'Allowed values:

        - MISSING_PERMISSION - The user does not have sufficient permissions

        '
      enum:
      - MISSING_PERMISSION
    OutputDocFormat:
      type: string
      description: 'Allowed values:

        - PDF - pdf

        - EPL - epl

        - ZPL - zpl

        - XML - xml

        '
      enum:
      - PDF
      - EPL
      - ZPL
      - XML
    ReturnSenderOrReceiver:
      required:
      - address
      - city
      - countryCode
      - postalCode
      type: object
      properties:
        company:
          maxLength: 100
          minLength: 0
          type: string
          description: Company name
          example: DPD Polska Sp. z o.o.
        name:
          maxLength: 100
          minLength: 0
          type: string
          description: Name
          example: Jan Kowalski
        address:
          maxLength: 100
          minLength: 0
          type: string
          description: Address
        city:
          maxLength: 50
          minLength: 0
          type: string
          description: City
          example: Warszawa
        countryCode:
          maxLength: 2
          minLength: 2
          type: string
          description: Two character country code in ISO ALPHA-2 format
          example: PL
        postalCode:
          maxLength: 10
          minLength: 4
          type: string
          description: Postal code
          example: '01354'
        phone:
          maxLength: 100
          minLength: 0
          type: string
          description: Optional phone number
          example: '48732121245'
        email:
          maxLength: 100
          minLength: 0
          type: string
          description: Optional email
          example: dpd@dpd.com.pl
      description: Sender data
    ReturnParcelResponse:
      type: object
      properties:
        status:
          $ref: '#/components/schemas/ReturnParcelGenerationStatus'
        reference:
          type: string
          description: Parcel reference
        waybill:
          type: string
          description: Waybill
        validationInfo:
          type: array
          description: Validation information
          items:
            $ref: '#/components/schemas/ReturnParcelValidationInfo'
      description: Generated parcels
    GenerateReturnLabelSenderOrReceiver:
      required:
      - address
      - city
      - countryCode
      - phone
      - postalCode
      type: object
      properties:
        fid:
          type: integer
          description: Sender or receiver fid
          format: int32
          example: 1234
        company:
          maxLength: 50
          minLength: 0
          type: string
          description: Company name
          example: DPD Polska Sp. z o.o.
        name:
          maxLength: 30
          minLength: 0
          type: string
          description: Name
          example: Jan Kowalski
        address:
          maxLength: 30
          minLength: 0
          type: string
          description: Address
        city:
          maxLength: 35
          minLength: 0
          type: string
          description: City
          example: Warszawa
        countryCode:
          maxLength: 2
          minLength: 2
          type: string
          description: Two character country code in ISO ALPHA-2 format
          example: PL
        postalCode:
          maxLength: 10
          minLength: 5
          type: string
          description: Postal code
          example: '01354'
        phone:
          maxLength: 30
          minLength: 0
          type: string
          description: Phone number
          example: '48732121245'
        email:
          maxLength: 100
          minLength: 0
          type: string
          description: Email
          example: dpd@dpd.com.pl
      description: Receiver
    Error401:
      type: object
      properties:
        status:
          $ref: '#/components/schemas/SecurityErrorEnum'
    GenerateReturnLabelResponse:
      required:
      - traceId
      type: object
      properties:
        status:
          $ref: '#/components/schemas/GenerateReturnLabelStatus'
        documentData:
          type: string
          description: Base64 encoded byte array with return label content
          format: byte
        session:
          $ref: '#/components/schemas/SessionResponse'
        traceId:
          type: string
          description: Request tracking ID. By providing it, you improve the analysis of problems related to the request.
          example: 3489d641-324f-4e46-9bf0-66a9af7218ab
    ParcelResponse:
      type: object
      properties:
        status:
          type: string
          description: Status
        reference:
          type: string
          description: Parcel reference
        waybill:
          type: string
          description: Parcel waybill
      description: Parcels
    SingleReturnPackage:
      maxLength: 30
      minLength: 1
      required:
      - parcels
      - payerFID
      - sender
      type: object
      properties:
        reference:
          maxLength: 50
          minLength: 0
          type: string
          description: Package reference
        receiver:
          $ref: '#/components/schemas/ReturnSenderOrReceiver'
        pudoReceiver:
          $ref: '#/components/schemas/ReturnPudoReceiver'
        sender:
          $ref: '#/components/schemas/ReturnSenderOrReceiver'
        payerFID:
          type: integer
          description: Payer fid
          format: int32
          example: 9999
        ref1:
          maxLength: 100
          minLength: 0
          type: string
          description: Ref 1
        ref2:
          maxLength: 100
          minLength: 0
          type: string
          description: Ref 1
        ref3:
          maxLength: 100
          minLength: 0
          type: string
          description: Ref 1
        services:
          type: array
          description: Additional services
          items:
            $ref: '#/components/schemas/TransportService'
        parcels:
          maximum: 1
          minimum: 1
          maxItems: 1
          minItems: 1
          type: array
          description: Parcels
          items:
            $ref: '#/components/schemas/SingleReturnParcel'
      description: Packages
    Errors:
      required:
      - errors
      type: object
      properties:
        errors:
          maxItems: 2147483647
          minItems: 1
          type: array
          description: Error list
          items:
            $ref: '#/components/schemas/Error'
        traceId:
          type: string
          description: Request tracking ID. By providing it, you improve the analysis of problems related to the request.
          example: 3489d641-324f-4e46-9bf0-66a9af7218ab
    ReturnGenerationPolicy:
      type: string
      description: 'Method of generating packages and parcels. Possible values:

        - STOP_ON_FIRST_ERROR - generating of parcels is interrupted in the case of the first encountered error. Packages and shipments created up to the first error will be returned.

        - IGNORE_ERRORS - no parcel generation interruption in case of validation error

        - ALL_OR_NOTHING - all packages will be returned or none if there is an error.

        '
      enum:
      - STOP_ON_FIRST_ERROR
      - IGNORE_ERRORS
      - ALL_OR_NOTHING
    TransportService:
      required:
      - code
      type: object
      properties:
        code:
          $ref: '#/components/schemas/ServiceCode'
        attributes:
          type: array
          description: Service parameter
          items:
            $ref: '#/components/schemas/Attribute'
      description: Additional services
    ReturnParcelValidationInfo:
      type: object
      properties:
        errorCode:
          $ref: '#/components/schemas/ReturnParcelValidationErrorCode'
        info:
          type: string
          description: Additional error information
      description: Validation information
    GenerateReturnLabelStatus:
      type: string
      description: 'Allowed value:

        - OK - OK. Return label was created

        - UNKNOWN_ERROR - unknown error

        - INCORRECT_DATA - incorrect data

        - NOT_FOUND - not found

        - FORBIDDEN - forbidden

        - DISABLED_API - API is disabled

        '
      enum:
      - OK
      - UNKNOWN_ERROR
      - INCORRECT_DATA
      - NOT_FOUND
      - FORBIDDEN
      - DISABLED_API
    GenerateReturnPackagesResponse:
      required:
      - traceId
      type: object
      properties:
        status:
          $ref: '#/components/schemas/GenerateReturnPackagesStatus'
        sessionId:
          type: integer
          description: Session id
          format: int64
        beginTime:
          type: string
          description: Session start in ISO-8601 format in UTC zone.
          format: date-time
        endTime:
          type: string
          description: Session end in ISO-8601 format in UTC zone.
          format: date-time
        packages:
          type: array
          items:
            $ref: '#/components/schemas/ReturnPackageResponse'
        traceId:
          type: string
          description: Request tracking ID. By providing it, you improve the analysis of problems related to the request.
          example: 3489d641-324f-4e46-9bf0-66a9af7218ab
    PickupErrorDetail:
      type: string
      description: 'Allowed values:

        - INCORRECT_VALUE - incorrect value

        - NOT_FOUND - not found

        - INCORRECT_PICKUP_TIME - incorrect pickup time

        - INCORRECT_CHECKSUM - incorrect checksum

        - SERVICE_UNAVAILABLE - service unavailable

        - VALIDATION - validation

        - ORDER_NUMBER_ERROR - order number error

        - ORDER_CLOSED_STATUS - order closed status

        - INCORRECT_STATUS - incorrect status

        '
      enum:
      - INCORRECT_VALUE
      - NOT_FOUND
      - INCORRECT_PICKUP_TIME
      - INCORRECT_CHECKSUM
      - SERVICE_UNAVAILABLE
      - VALIDATION
      - ORDER_NUMBER_ERROR
      - ORDER_CLOSED_STATUS
      - INCORRECT_STATUS
    LabelFormat:
      type: string
      description: 'Allowed values:

        - A4 - A4

        - LBL_PRINTER - lbl printer

        '
      enum:
      - A4
      - LBL_PRINTER
    GenerateReturnPackagesRequest:
      required:
      - generationPolicy
      - packages
      type: object
      properties:
        generationPolicy:
          $ref: '#/components/schemas/ReturnGenerationPolicy'
        packages:
          maxLength: 30
          minLength: 1
          maxItems: 30
          minItems: 1
          type: array
          description: Packages
          items:
            $ref: '#/components/schemas/SingleReturnPackage'
    GenerateReturnLabelRequest:
      required:
      - outputDocFormat
      - outputDocPageFormat
      - outputLabelType
      - receiver
      - waybills
      type: object
      properties:
        waybills:
          maxLength: 10
          minLength: 1
          maxItems: 10
          minItems: 1
          type: array
          description: Original waybills for return
          items:
            maxLength: 20
            minLength: 1
            type: string
            description: Original waybills for return
        receiver:
          $ref: '#/components/schemas/GenerateReturnLabelSenderOrReceiver'
        outputDocFormat:
          $ref: '#/components/schemas/OutputDocFormat'
        outputDocPageFormat:
          $ref: '#/components/schemas/LabelFormat'
        outputLabelType:
          $ref: '#/components/schemas/OutputLabelType'
    ErrorDetails:
      type: object
      properties:
        code:
          $ref: '#/components/schemas/PickupErrorDetail'
        description:
          type: string
          description: Error description
        fields:
          type: string
          description: Field with error
      description: Errors list
    SingleReturnParcel:
      maximum: 1
      minimum: 1
      required:
      - weight
      type: object
      properties:
        reference:
          maxLength: 50
          minLength: 0
          type: string
          description: Parcel reference
        waybill:
          maxLength: 50
          minLength: 6
          type: string
          description: Parcel waybill
        weight:
          maximum: 1000
          minimum: 0.01
          type: number
          description: In Poland, the maximum weight is 700.00 kg, the minimum is 0.01 kg. Abroad, the maximum weight is 315.00 kg, the minimum is 0.01 kg. For shipments with a pallet service, the minimum weight is 315 kg. Accuracy to two decimal places is accepted.
        sizeX:
          maximum: 300
          minimum: 1
          type: number
          description: Dimension X of the package expressed in centimeters
        sizeY:
          maximum: 300
          minimum: 1
          type: number
          description: Dimension Y of the package expressed in centimeters
        sizeZ:
          maximum: 300
          minimum: 1
          type: number
          description: Dimension Z of the package expressed in centimeters
        content:
          maxLength: 300
          minLength: 0
          type: string
          description: Parcel content. The content field is required for international shipments. For domestic shipments it is optional.
        customerData1:
          maxLength: 200
          minLength: 0
          type: string
          description: Dodatkowe data 1
        customerData2:
          maxLength: 200
          minLength: 0
          type: string
          description: Dodatkowe data 2
        customerData3:
          maxLength: 200
          minLength: 0
          type: string
          description: Dodatkowe data 3
      description: Parcels
    ReturnPackageValidationInfo:
      type: object
      properties:
        errorCode:
          $ref: '#/components/schemas/ReturnPackageValidationErrorCode'
        info:
          type: string
          description: Additional information
      description: Package validation information
    ReturnPackageGenerationStatus:
      type: string
      description: 'Allowed values:

        - OK - package created successfully

        - INCORRECT_DATA - incorrect data

        - NOT_PROCESSED - not processed

        - DUPLICATED_PARCEL_WAYBILL - duplicated waybill

        '
      enum:
      - OK
      - INCORRECT_DATA
      - NOT_PROCESSED
      - DUPLICATED_PARCEL_WAYBILL
    PackageResponse:
      required:
      - parcels
      - statusInfo
      type: object
      properties:
        statusInfo:
          $ref: '#/components/schemas/StatusInfo'
        parcels:
          type: array
          description: Printed parcels
          items:
            $ref: '#/components/schemas/ParcelResponse'
      description: Packages
    ReturnPackageValidationErrorCode:
      type: string
      description: 'Allowed values:

        - RECEIVER_COUNTRY_CODE_NOT_FOUND - Receiver country code not found

        - SENDER_COUNTRY_CODE_NOT_FOUND - Sender country code not found

        - INCORRECT_SENDER_POSTAL_CODE - Incorrect sender postal code

        - INCORRECT_RECEIVER_POSTAL_CODE - Incorrect receiver postal code

        - INCORRECT_RECEIVER_ADDRESS - Incorrect receiver address

        - INCORRECT_RECEIVER_CITY - Incorrect receiver city

        - TIME0930_IS_UNAVAILABLE_FOR_POSTAL_CODE - TIME 09:30 is unavailable for postal code

        - TIME1200_IS_UNAVAILABLE_FOR_POSTAL_CODE - TIME 12:00 is unavailable for postal code

        - NEXT_DAY_IS_UNAVAILABLE_FOR_POSTAL_CODE - DPD_NEXT_DAY service is unavailable for postal code

        - SATURDAY_IS_UNAVAILABLE_FOR_POSTAL_CODE - SATURDAY service is unavailable for postal code

        - INTERNATIONAL_IS_UNAVAILABLE_FOR_POSTAL_CODE - INTERNATIONAL service is unavailable for postal code

        - TIME_FIXED_IS_UNAVAILABLE_FOR_POSTAL_CODE - TIME_FIXED service is unavailable for postal code

        - TIME_FIXED_IS_OUT_OF_RANGE - TIME_FIXED service is out of range

        - DPD_TODAY_IS_NOT_AVAILABLE_FOR_POSTAL_CODE - DPD_TODAY service is not available for postal code

        - PALETTE_IS_NOT_AVAILABLE_FOR_POSTAL_CODE - PALETTE service is not available for postal code

        - PALETTE_EXCEEDED_DIMENSION_80X120X170 - Parcel exceeded dimension 80x120x170 with PALETTE service

        - PALETTE_EXCEEDED_DIMENSION_80X120X220 - Parcel exceeded dimension 80x120x220 with PALETTE service

        - B2C_INCORRECT_VALUE_RANGE - B2C incorrect value range

        - CLASSIC_SERVICE_IS_UNAVAILABLE - CLASSIC service is unavailable

        - SELF_COLLECTION_SERVICE_UNAVAILABLE_FOR_INTERNATIONAL_SHIPMENT - SELF_COLLECTION service is not available for international shipment

        - DEDICATED_DELIVERY_SERVICE_UNAVAILABLE_FOR_INTERNATIONAL_SHIPMENT - DEDICATED_DELIVERY service is not available for international shipment

        - DUTY_SERVICE_UNAVAILABLE_FOR_RECIPIENT_COUNTRY_CODE - DUTY service is not available for recipient country code

        - SERVICE_IS_UNAVAILABLE - Service is unavailable

        - VALUE_INCORRECT - Value is incorrect

        - INCORRECT_PUDO - incorrect pudo

        - DPD_FOOD_IS_NOT_AVAILABLE_FOR_POSTAL_CODE - DPD_FOOD service is not available for postal code

        - DPD_FOOD_AND_0930_IS_NOT_AVAILABLE_FOR_POSTAL_CODE - DPD_FOOD service and TIME0930 is not available for postal code

        - DPD_FOOD_AND_1200_IS_NOT_AVAILABLE_FOR_POSTAL_CODE - DPD_FOOD service and TIME1200 is not available for postal code

        - DPD_FOOD_AND_DPD_PICKUP_IS_NOT_AVAILABLE_FOR_POSTAL_CODE - DPD_FOOD service and DPD_PICKUP is not available for postal code

        - DPD_FOOD_AND_DPD_TODAY_IS_NOT_AVAILABLE_FOR_POSTAL_CODE - DPD_FOOD service and DPD_TODAY is not available for postal code

        - ERROR_SERVICES_AVAILABILITY_COD - COD service is unavailable for select postal code

        - ERROR_SERVICES_AVAILABILITY_EXPRESS_COD - COD service is unavailable for select service

        - DIGITAL_LABEL_IS_NOT_AVAILABLE_FOR_FID - DIGITAL_LABEL service is not available for given customer

        - DPD_PICKUP_IS_NOT_AVAILABLE_FOR_PUDO - DPD_PICKUP service is not available for PUDO

        - INACTIVE_PUDO - Selected PUDO is inactive

        - COD_AMOUNT_CURRENCY_IS_NOT_AVAILABLE - COD service amount currency is no available

        '
      enum:
      - RECEIVER_COUNTRY_CODE_NOT_FOUND
      - SENDER_COUNTRY_CODE_NOT_FOUND
      - INCORRECT_SENDER_POSTAL_CODE
      - INCORRECT_RECEIVER_POSTAL_CODE
      - INCORRECT_RECEIVER_ADDRESS
      - INCORRECT_RECEIVER_CITY
      - TIME0930_IS_UNAVAILABLE_FOR_POSTAL_CODE
      - TIME1200_IS_UNAVAILABLE_FOR_POSTAL_CODE
      - NEXT_DAY_IS_UNAVAILABLE_FOR_POSTAL_CODE
      - SATURDAY_IS_UNAVAILABLE_FOR_POSTAL_CODE
      - INTERNATIONAL_IS_UNAVAILABLE_FOR_POSTAL_CODE
      - TIME_FIXED_IS_UNAVAILABLE_FOR_POSTAL_CODE
      - TIME_FIXED_IS_OUT_OF_RANGE
      - DPD_TODAY_IS_NOT_AVAILABLE_FOR_POSTAL_CODE
      - PALETTE_IS_NOT_AVAILABLE_FOR_POSTAL_CODE
      - PALETTE_EXCEEDED_DIMENSION_80X120X170
      - PALETTE_EXCEEDED_DIMENSION_80X120X220
      - B2C_INCORRECT_VALUE_RANGE
      - CLASSIC_SERVICE_IS_UNAVAILABLE
      - SELF_COLLECTION_SERVICE_UNAVAILABLE_FOR_INTERNATIONAL_SHIPMENT
      - DEDICATED_DELIVERY_SERVICE_UNAVAILABLE_FOR_INTERNATIONAL_SHIPMENT
      - DUTY_SERVICE_UNAVAILABLE_FOR_RECIPIENT_COUNTRY_CODE
      - SERVICE_IS_UNAVAILABLE
      - VALUE_INCORRECT
      - INCORRECT_PUDO
      - DPD_FOOD_IS_NOT_AVAILABLE_FOR_POSTAL_CODE
      - DPD_FOOD_AND_0930_IS_NOT_AVAILABLE_FOR_POSTAL_CODE
      - DPD_FOOD_AND_1200_IS_NOT_AVAILABLE_FOR_POSTAL_CODE
      - DPD_FOOD_AND_DPD_PICKUP_IS_NOT_AVAILABLE_FOR_POSTAL_CODE
      - DPD_FOOD_AND_DPD_TODAY_IS_NOT_AVAILABLE_FOR_POSTAL_CODE
      - COD_IS_NOT_AVAILABLE_FOR_POSTAL_CODE
      - COD_IS_NOT_AVAILABLE
      - DIGITAL_LABEL_IS_NOT_AVAILABLE_FOR_FID
      - DPD_PICKUP_IS_NOT_AVAILABLE_FOR_PUDO
      - INACTIVE_PUDO
      - COD_AMOUNT_CURRENCY_IS_NOT_AVAILABLE
    Attribute:
      type: object
      properties:
        code:
          maxLength: 50
          minLength: 0
          type: string
          description: Service parameter code
          example: VALUE
        value:
          maxLength: 100
          minLength: 0
          type: string
          description: Service parameter value
          example: '12:00'
      description: Service parameter
    SessionResponse:
      required:
      - statusInfo
      type: object
      properties:
        sessionId:
          type: integer
          description: Session id
          format: int64
        statusInfo:
          $ref: '#/components/schemas/StatusInfo'
        packages:
          type: array
          description: Packages
          items:
            $ref: '#/components/schemas/PackageResponse'
      description: Session
    ServiceCode:
      type: string
      description: '<br>List of available services can be found in the section <a href="#section/Available-Services"><b>Available Services</b></a><br>

        '
      example: TIME_FIXED
      enum:
      - DECLARED_VALUE
      - COD
      - CUD
      - ROD
      - HAND_DELIVERY
      - SELF_COLLECTION
      - PRIVATE_PERSON
      - CARRY_IN
      - DUTY
      - PALETTE
      - DOX
      - DPD_EXPRESS
      - TIRES
      - TIRES_EXPORT
      - DPD_PICKUP
      - DPD_FOOD
      - TIME0930
      - TIME1200
      - B2C
      - TIME_FIXED
      - SATURDAY
      - INTERNATIONAL
      - DPD_NEXT_DAY
      - DPD_TODAY
      - DPD_LQ
      - DIGITAL_LABEL
      - PUDO_TO_SEND
      - ALLEGRO_DELIVERY
      - PARTNER_PICKUP
    GenerateReturnPackagesStatus:
      type: string
      description: 'Allowed values:

        - OK - successful package creation

        - UNKNOWN_ERROR - unknown error

        - INCORRECT_DATA - incorrect data

        - DISABLED_API - disabled API

        - DUPLICATED_PARCEL_WAYBILL - duplicated parcel waybilll

        - DISALLOWED_FID - fid is disallowed

        - ERROR_NO_FID_PERMISSION - missing permissions for FID

        - DUPLICATED_PACKAGE_REFERENCE - duplicated package reference. Use unique package reference value.

        - DUPLICATED_PARCEL_REFERENCE - duplicated parcel reference. Use unique parcel reference value.

        '
      enum:
      - OK
      - UNKNOWN_ERROR
      - INCORRECT_DATA
      - DISABLED_API
      - DUPLICATED_PARCEL_WAYBILL
      - ERROR_NO_FID_PERMISSION
      - DUPLICATED_PACKAGE_REFERENCE
      - DUPLICATED_PARCEL_REFERENCE
      - DISALLOWED_FID
    ReturnPudoReceiver:
      required:
      - countryCode
      type: object
      properties:
        company:
          maxLength: 100
          minLength: 0
          type: string
          description: Company name
          example: DPD Polska Sp. z o.o.
        name:
          maxLength: 100
          minLength: 0
          type: string
          description: Name
          example: Jan Kowalski
        countryCode:
          maxLength: 2
          minLength: 2
          type: string
          description: Two character country code in ISO ALPHA-2 format
          example: PL
        phone:
          maxLength: 100
          minLength: 0
          type: string
          description: Optional phone number
          example: '48732121245'
        email:
          maxLength: 100
          minLength: 0
          type: string
          description: Optional email
          example: dpd@dpd.com.pl
      description: Receiver data
    ReturnPackageResponse:
      required:
      - parcels
      type: object
      properties:
        status:
          $ref: '#/components/schemas/ReturnPackageGenerationStatus'
        reference:
          type: string
          description: Package reference
        validationInfo:
          type: array
          description: Package validation information
          items:
            $ref: '#/components/schemas/ReturnPackageValidationInfo'
        parcels:
          type: array
          description: Generated parcels
          items:
            $ref: '#/components/schemas/ReturnParcelResponse'
    StatusInfo:
      type: object
      properties:
        status:
          $ref: '#/components/schemas/PackagesPickupCallStatus'
        errorDetails:
          type: array
          description: Errors list
          items:
            $ref: '#/components/schemas/ErrorDetails'
      description: Pickup call update order status
    OutputLabelType:
      type: string
      description: 'Allowed values:

        - BIC3 - BIC3

        - EXTENDED - Extended

        - RETURN - Return*



        *Available only for international returns

        '
      enum:
      - BIC3
      - EXTENDED
      - RETURN
    PackagesPickupCallStatus:
      type: string
      description: 'Allowed values:

        - OK - correct order change

        - UNKNOWN_ERROR - unknown error

        - DISABLED_API - disabled API

        - DISALLOWED_FID - disallowed fid

        - VALIDATION_ERROR - validation error

        - NOT_FOUND - not found

        - SERVICE_UNAVAILABLE - service unavailable

        '
      enum:
      - OK
      - UNKNOWN_ERROR
      - DISABLED_API
      - DISALLOWED_FID
      - VALIDATION_ERROR
      - NOT_FOUND
      - SERVICE_UNAVAILABLE
    Error:
      required:
      - code
      - rejectedValue
      - userMessage
      type: object
      properties:
        code:
          type: string
          description: Code with the error category (group)
        subCode:
          type: string
          description: Error code
        userMessage:
          type: string
          description: Error code description
          example: Receiver postal code is required
        rejectedValue:
          type: string
          description: Invalid value
        field:
          type: string
          description: Full path of the field that contains the error
          example: receiver.postalCode
      description: Error list
  securitySchemes:
    basicAuth:
      type: http
      scheme: basic
x-tagGroups:
- name: API's
  tags:
  - postalCodeTag
  - packagesParcelsTag
  - labelsProtocolsTag
  - courierOrderTag
  - returnParcelTag
  - dropOffPinTag
